[package]
name = "xades_rust_core"
version = "0.2.1"
edition = "2021"
authors = ["OpenThai AI"]
description = "W3C Exclusive C14N for XAdES/eTax — native extension"

[lib]
name = "xades_rust_core"
crate-type = ["cdylib"]

[dependencies]
# pyo3 >= 0.21 required for Bound<'_, PyModule> API
pyo3 = { version = "0.21", features = ["extension-module"] }
# quick-xml >= 0.31 required for config_mut() + unescape_value()
quick-xml = { version = "0.31", features = ["serialize"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
