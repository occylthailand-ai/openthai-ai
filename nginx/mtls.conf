# หมวด 12 — Network / Connectivity: mTLS Configuration
# Mutual TLS สำหรับ service-to-service communication
# ใช้กับ: XAdES Engine ↔ Peppol Gateway ↔ RD Gateway

# ===== Internal mTLS Upstream (XAdES Engine) =====
upstream xades_engine {
    server xades-api:8000;
    keepalive 32;
}

upstream peppol_gateway {
    server peppol-gateway:8001;
    keepalive 16;
}

# ===== Public API (TLS Termination) =====
server {
    listen 443 ssl http2;
    server_name api.openthai.ai;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req zone=api_limit burst=20 nodelay;

    location /api/v1/verify {
        proxy_pass http://xades_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location /api/v1/peppol {
        proxy_pass http://peppol_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location /health {
        proxy_pass http://xades_engine/health;
        access_log off;
    }
}

# ===== Internal mTLS: Service-to-Service =====
server {
    listen 8443 ssl http2;
    server_name internal.openthai.ai;

    # Server certificate
    ssl_certificate     /etc/nginx/certs/internal-server.crt;
    ssl_certificate_key /etc/nginx/certs/internal-server.key;

    # Client certificate verification (mTLS)
    ssl_client_certificate /etc/nginx/certs/internal-ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    ssl_protocols   TLSv1.3;
    ssl_ciphers     TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # ตรวจ client cert CN ต้องเป็น service ที่รู้จัก
    if ($ssl_client_s_dn_cn !~ "^(xades-engine|peppol-gateway|rd-gateway|platform-api)$") {
        return 403;
    }

    location /internal/xades {
        proxy_pass http://xades_engine;
        proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /internal/peppol {
        proxy_pass http://peppol_gateway;
        proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.openthai.ai;
    return 301 https://$host$request_uri;
}
